# pnpm 11 requires explicit approval of dependency build scripts.
# Without this file `pnpm install` exits 1 (ERR_PNPM_IGNORED_BUILDS),
# which would break the Vercel/CI build.
allowBuilds:
  '@scarf/scarf': false
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  unrs-resolver: true

# Pull patched transitive versions for known advisories (same major, no breaking
# changes): postcss path-traversal / .map disclosure fixes (used in the prod CSS
# pipeline) and the sharp/libvips CVEs (optional dep; next/image is unused).
overrides:
  postcss: '>=8.5.23'
  sharp: '>=0.35.0'
